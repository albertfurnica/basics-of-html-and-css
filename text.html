<!DOCTYPE html>
<html>

<head>
    <title>formatare text</title>
    <!-- introducerea altor fonturi -->
    <link rel = "preconnect" href = "https://fonts.googleapis.com">
    <link rel = "stylesheet" href = "text.css">
</head>

<body>
    <p class = "video-title">Talking Tech and AI with Google CEO Sundar Pichail!</p>
    <!-- &#183 - HTML entity - un punct pe ecran 
        &#10003 - o bifa, &#62 - >, se gasesc pe google -->
    <p class = "video-stats">3.4M views &#183; 6 months ago</p>
    <p class = "video-author">Marques Brownlee &#10003;</p>
    <p class = "video-description">Talking tech and AI on the heels of Google I/O. 
        Also a daily driver phone reveal from Google's CEO. 
        Shoutout to Sundar!</p>

    <!-- <span> - text element - evidenteaza doar anumite parti a unui text
         span este text elementul simplu, fara nimic adaugat asupra caruia
        este cel mai usor de lucrat -->
<p class = "apple-text">Shop early for the best selection of holiday favourites. <span class = "shop-link">Shop now &#62;</span></p>
</body>

</html>
