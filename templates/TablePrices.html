<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel de Prețuri</title>
    <link rel="stylesheet" href="TablePrices.css">
</head>
<body>
    <div class="header">
        <h1>Alege abonamentul potrivit</h1>
    </div>

    <div class="pricing-container">
        <div class="card">
            <h2>Basic</h2>
            <div class="price">$5<span>/lună</span></div>
            <ul>
                <li>1 Utilizator</li>
                <li>10GB Stocare</li>
                <li>Suport Email</li>
            </ul>
            <button>Cumpără</button>
        </div>

        <div class="card highlight">
            <h2>Pro</h2>
            <div class="price">$15<span>/lună</span></div>
            <ul>
                <li>5 Utilizatori</li>
                <li>50GB Stocare</li>
                <li>Suport Prioritar</li>
            </ul>
            <button>Cumpără</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <div class="price">$30<span>/lună</span></div>
            <ul>
                <li>Utilizatori Nelimitați</li>
                <li>Stocare Nelimitată</li>
                <li>Suport 24/7</li>
            </ul>
            <button>Cumpără</button>
        </div>
    </div>
</body>
</html>
