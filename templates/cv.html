<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofoliu Personal</title>
    <link rel="stylesheet" href="cv.css">
<body>
    <header>
        <nav>
            <a href="#acasa">Acasă</a>
            <a href="#abilitati">Abilități</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="acasa" class="hero">
        <img src="https://via.placeholder.com/150" alt="Poza de profil">
        <h1>Furnica Albert Leonard</h1>
        <p>Dezvoltator Web Front-End</p>
    </section>

    <section id="abilitati" class="skills">
        <h2>Abilități Tehnice</h2>
        <ul>
            <li>HTML5</li>
            <li>CSS3</li>
            <li>Design Responsiv</li>
        </ul>
    </section>

    <section id="contact" class="contact">
        <h2>Date de contact</h2>
        <form>
            <input type="text" placeholder="Numele tău" required>
            <input type="email" placeholder="Adresa de email" required>
            <textarea placeholder="Mesajul tău" rows="5" required></textarea>
            <button type="submit">Trimite Mesaj</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Furnica Albert Leonard</p>
    </footer>
</body>
</html>
