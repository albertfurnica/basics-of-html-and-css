<!DOCTYPE html>
<html>
    <head>

        <title>formatare pozitii</title>

    </head>

    <body style = "
    height: 3000px;
    padding-top: 60px;
    padding-left: 80px;
    ">

        <div style = "
        background-color: black;
        color: white;
/*      !!!
        position: fixed - fixeaza header ul pe pagina atunci cand se scrolleaza
        top: 10px; - distanta dintre partea superioara a paginii si div ul in sine
        am folosit height pentru a ramane fix si sa nu intervina cu partea de jos a paginii
*/
        position: fixed;
        top: 0px;
        left: 0px;
        right: 0px;
        height: 50px;
/*      !!!
        z-index: 1 - muta in prim plan headerul in functie de valoarea z-index
*/
        z-index: 1;
        "> header </div>

        <!-- crearea unui sidebar -->
        <div style = "
        background-color: green;
        color: white;
        position: fixed;
        top: 50px;
        left: 0px;
        bottom: 0px;
        width: 72px;
        "> sidebar 

            <!-- aceste proprietati se aplica in functie de div ul in care se afla elementul -->
            <div style = "
            position: absolute;
            background-color: red;
            color: white;
            top: 0px;
            right: 0px;
            ">
                X
            </div>  

        </div>

        <!-- 
        diferenta cu positon: absolute; 
        fixed = plasat in browser window / partea pe care o vede utilizatorul cand da scroll
        absolute = plasat pe pagina / toata pagina in sine
        -->
        <div style = "
        position: absolute;
        background-color: red;
        color: white;
        top: 60px;
        right: 10px;
        ">
            absolute
        </div>

        <div style = "
        background-color: lightblue;
        height: 200px;
        width: 200px;
        "> div1 </div>

        <!-- 
        pozitionarea unui element absolut in interiorul unui alt element relativ 
        deobicei pentru a plasa anumite informatii despre un grid cu informatii
        -->
        <div style = "
        background-color: lightpink;
        height: 200px;
        width: 200px;
        position: relative;
        "> div2

            <div style = "
            position: absolute;
            background-color: rgb(0, 0, 0);
            color: white;
            bottom: 5px;
            right: 5px;
            ">
                5:00
            </div>

        </div>

    </body>

</html>
