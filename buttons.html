<!DOCTYPE html>
<html>

<head>
    <title>formatare butoane</title>
    <!-- legatura dintre fisiere, se plaseaza in head
    link este un element de tipul void fiindca nu necesita tagul de inchidere
    rel(relation) = tipul de fisier, href = calea fisierului -->
    <link rel="stylesheet" href="buttons.css">
</head>

<body>
    <!-- eticheta pusa asupra butonului pentru a il customiza separat in buttons.css -->
    <button class = "subscribe-button">SUBSCRIBE</button>
    <button class = "join-button">JOIN</button>
    <button class = "tweet-button">Tweet</button>
</body>

</html>
