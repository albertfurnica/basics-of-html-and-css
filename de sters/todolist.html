<!DOCTYPE html>
<html>
    <head>
        <title>todolist</title>
        <link rel="stylesheet" href="todolist.css">
    </head>

    <body>
        
        <div class="todo-container">
        <h2>Lista de Sarcini</h2>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Adaugă o sarcină nouă...">
            <button id="addBtn">Adaugă</button>
        </div>

        <ul class="task-list">
            <li>
                <label>
                    <input type="checkbox"> 
                    <span>Finalizează proiectul Web API</span>
                </label>
                <button class="delete-btn">Șterge</button>
            </li>
            
            <li class="completed">
                <label>
                    <input type="checkbox" checked> 
                    <span>Citește cursul de POO</span>
                </label>
                <button class="delete-btn">Șterge</button>
            </li>
        </ul>
    </div>

    </body>

</html>
