<!DOCTYPE html>
<html>
    <head>
        <title>formatare grid</title>
        <link rel = "styleshee" href = "grid.css">
    </head>

    <body style = "padding-bottom: 1000px;">
        <div style = "
/*          !!!
            display: grid - selecteaza display ul sa fie de tip grid
*/
            display: grid;

/*          !!!      
            grid-template-columns - creeaza griduri de tip coloana
            numarul valorilor - numarul de coloane
            valoarea in sine - latimea coloanei
*/
            grid-template-columns: 100px 100px;
            ">
            <!-- inline styles - posibilitatea de a scrie css intre taguri  -->
            <div style = "background-color: lightblue">
                div1
            </div>
            <div style = "background-color: lightpink;">
                div2 <p>text</p>
            </div>
        </div>

        <div style = "
            margin-top: 30px;
            display: grid; 
            grid-template-columns: 100px 100px 200px;
            ">
            <!-- inline styles - posibilitatea de a scrie css intre taguri  -->
            <div style = "background-color: lightblue">
                100px
            </div>
            <div style = "background-color: lightpink;">
                100px <p>text</p>
            </div>
            <div style = "background-color: lightblue">
                200px
            </div>
            <div style = "background-color: lightpink;">
                100px
            </div>
        </div>

        <div style = "
            margin-top: 20px;
            display: grid; 
            grid-template-columns: 100px 1fr; /* fr - freespace */
            ">
            <div style = "background-color: lightblue">
                100px
            </div>

            <div style = "background-color: lightpink;">
                1fr
            </div>

        </div>

        <div style = "
            margin-top: 20px;
            display: grid; 
            grid-template-columns: 100px 1fr 2fr; /* fr - freespace */
            ">
            <div style = "background-color: lightblue">
                100px
            </div>
            <div style = "background-color: lightpink;">
                1fr
            </div>
            <div style = "background-color: lightblue">
                2fr
            </div>
        </div>

        <div style="
        margin-top: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;

/*      !!!   
        column-gap - spatiul dintre coloane 
*/
        column-gap: 20px;
        row-gap: 40px;
        ">

            <div style = "background-color: lightblue; height: 200px;">
                1fr
            </div>

            <div style = "background-color: lightpink; height: 200px;">
                1fr
            </div>

            <div style = "background-color: lightblue; height: 200px;">
                1fr
            </div>

            <div style = "background-color: lightpink; height: 200px;">
                1fr
            </div>

            <div style = "background-color: lightblue; height: 200px;">
                1fr
            </div>

            <div style = "background-color: lightpink; height: 200px;">
                1fr
            </div>
        
        </div>

    </body>

</html>
