<!--
<button> = html element, fiecare element are un tag
<button> (opening tag) 
</button> (closing tag)
1. block element = isi ocupa intreaga linie (<p> paragraful)
2. inline-block element = isi ocupa doar cat are nevoie (img, input)
3. inline element = apare intr o linie de text
<div> = division (just a box / containere) - block element by default
<div> poate contine alte elemente
-->

<!DOCTYPE html>
<html>

<!-- sectiunea de titlul al paginii -->
<head>
    <!-- titlul efectiv al paginii -->
    <title>pagina testing</title>
    <link rel = "stylesheet" href = "index.css">
</head>

<!-- corpul propriu zis al paginii -->
<body>
    <!-- paragraf -->
    <p>apasa urmatorul buton</p>
    <!-- buton -->
    <button>nimic aici</button>
    <!-- <a></a> = anchor element = link catre alt site, fara href nu ar avea nicio referinta si ar fi doar text -->
    <!-- elementele pot avea mai multe atribute -->
    <!-- href = html attribute, se modifica destinatia linkului -->
    <!-- target = html attribute, se modifica modul de deschidere al linkului -->
    <a href="https://www.youtube.com/" target = "_blank"> link to yt : </a>


    <!-- introducere textbox -->
    <!-- placeholder apare vizual pana se introduce ceva -->
    <input type = "textbox" placeholder = "introdu ceva">
    <input type = "checkbox">
    <input type = "password" placeholder = "introdu parola">

    <!-- introducere imagine, src = calea fisierului -->
    <img class = "thumbnail" src = "photos/thumbnail-1.webp">

    <div class = "div-example">
        exemplu de div
    </div>
</body>

</html>
